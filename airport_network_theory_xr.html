      g.fillText('Degree ' + deg[a] + '   ·   Betweenness #' + rank[a] + ' of ' + fmt(N), 50, 146);
      g.fillText('Community: ' + (comm[a] < 9 ? COMM_NAMES[comm[a]] : 'a smaller cluster'), 50, 194);
      g.fillStyle = '#b6a98a'; g.font = `400 27px ${FONT}`; g.fillText('Pick a second airport to find the shortest path.', 50, 262);
    } else {
      const p = selPath;
      g.fillStyle = '#ffd98a'; g.font = `700 46px ${FONT}`;
      g.fillText(code[sel[0]] + ' to ' + code[sel[1]] + ':  ' + (p ? (p.length - 1) + (p.length === 2 ? ' flight' : ' flights') : 'not connected'), 48, 80);
      g.fillStyle = '#efe6d2'; g.font = `400 30px ${FONT}`;
      let y = 132;
      const txt = p ? p.map((i) => code[i]).join('  →  ') : 'No sequence of routes links these two airports.';
      for (const line of wrap(g, txt, 920)) { g.fillText(line, 50, y); y += 42; }
      if (p) { g.fillStyle = '#b6a98a'; g.font = `400 26px ${FONT}`; g.fillText(fmt(gcKm(sel[0], sel[1])) + ' km as the crow flies. Pick another airport to start over.', 50, Math.min(y + 18, 300)); }
    }
    info.tex.needsUpdate = true;
  }

  // ----------------------------------------------------------------- SELECTION
  let sel = [], selPath = null, selObj = null, hoverIdx = -1, hoverLabel = null;
  function nearestAirport(local, thrDeg) {
    let best = -1, bestDot = Math.cos(thrDeg * DEG);
    for (let i = 0; i < N; i++) {
      const d = dirs[3 * i] * local.x + dirs[3 * i + 1] * local.y + dirs[3 * i + 2] * local.z + 0.00002 * Math.sqrt(deg[i]);
      if (d > bestDot) { bestDot = d; best = i; }
    }
    return best;
  }
  function clearSelection() {
    sel = []; selPath = null; U.uSelA.value = -1; U.uSelB.value = -1; U.uSel.value = 0;
    if (selObj) { globe.remove(selObj); disposeTree(selObj); selObj = null; }
    dropLabels('sel'); info.mesh.visible = false;
  }
  function selectAirport(i) {
    if (i < 0) { clearSelection(); return; }
    if (sel.length >= 2 || sel[0] === i) clearSelection();
    sel.push(i);
    U.uSelA.value = sel[0]; U.uSelB.value = sel.length > 1 ? sel[1] : -1;
    if (selObj) { globe.remove(selObj); disposeTree(selObj); selObj = null; }
    dropLabels('sel');
    U.uSel.value = 1;
    if (sel.length === 1) {
      U.uSelProg.value = 0; U.uSelAlpha.value = 1;
      selObj = fan(i, [1.0, 0.82, 0.35], U.uSelProg, U.uSelAlpha, 11);
      tweens.push({ name: 'uSelProg', to: 1, dur: 1.4, start: now, from: null });
      addLabel(i, code[i] + '  ' + city[i], [1, 0.88, 0.55], 0, Infinity, 'sel');
    } else {
      selPath = bestPath(sel[0], sel[1]);
      if (selPath && selPath.length > 1) {
        U.uSelPath.value = 0;
        selObj = tubes(selPath.slice(1).map((b, k) => [selPath[k], b]), 0.0042, [1.0, 0.80, 0.30], U.uSelPath, { value: 1 }, true);
        tweens.push({ name: 'uSelPath', to: selPath.length - 1, dur: 0.8 * (selPath.length - 1), start: now, from: null });
        selPath.forEach((p, k) => addLabel(p, code[p] + '  ' + city[p], [1, 0.88, 0.55], 0.8 * Math.max(0, k - 0.15), Infinity, 'sel'));
      } else {
        addLabel(sel[0], code[sel[0]], [1, 0.88, 0.55], 0, Infinity, 'sel'); addLabel(sel[1], code[sel[1]], [1, 0.88, 0.55], 0, Infinity, 'sel');
      }
    }
    if (selObj) globe.add(selObj);
    drawInfo();
  }
  function setHover(i) {
    if (i === hoverIdx) return;
    hoverIdx = i;
    if (hoverLabel) { hoverLabel.userData.tOut = now; hoverLabel.userData.dispose = true; hoverLabel = null; }
    if (i >= 0 && !sel.includes(i)) hoverLabel = addLabel(i, code[i] + '  ' + city[i] + '  ·  ' + deg[i] + ' routes', [0.85, 0.93, 1], 0, Infinity, 'hover');
  }

  // --------------------------------------------------------------- POINTERS
  const pointers = [];
  function makePointer(kind, ctrl) {
    const p = { kind, ctrl, rc: new THREE.Raycaster(), ndc: new THREE.Vector2(9, 9), down: false, hit: null, downHit: null,
      drag: null, squeeze: null, source: null, prev: [], moved: 0, downAt: 0 };
    pointers.push(p);
    return p;
  }
  const mouse = makePointer('mouse', null);
  function updateRay(p) {
    if (p.kind === 'mouse') { p.rc.setFromCamera(p.ndc, camera); return; }
    p.ctrl.updateMatrixWorld();
    p.rc.ray.origin.setFromMatrixPosition(p.ctrl.matrixWorld);
    p.rc.ray.direction.set(0, 0, -1).transformDirection(p.ctrl.matrixWorld);
  }
  function sphereHit(ray) {
    const C = globe.getWorldPosition(new V3()), Rw = GLOBE_R * zoom;
    const oc = ray.origin.clone().sub(C), b = oc.dot(ray.direction), c = oc.lengthSq() - Rw * Rw, disc = b * b - c;
    if (disc < 0) return null;
    const t = -b - Math.sqrt(disc);
    if (t < 0) return null;
    const point = ray.origin.clone().addScaledVector(ray.direction, t);
    return { type: 'globe', distance: t, point, local: globe.worldToLocal(point.clone()).normalize() };
  }
  function hitTest(p) {
    let best = null;
    for (const P of [panel, info]) {
      if (!P.mesh.visible) continue;
      const h = p.rc.intersectObject(P.mesh, false)[0];
      if (h && (!best || h.distance < best.distance)) best = { type: 'panel', panel: P, distance: h.distance, point: h.point, uv: h.uv };
    }
    const gh = sphereHit(p.rc.ray);
    if (gh && (!best || gh.distance < best.distance)) best = gh;
    return best;
  }
  function buttonAt(h) {
    if (!h || h.type !== 'panel' || h.panel !== panel) return null;
    const x = h.uv.x * panel.W, y = (1 - h.uv.y) * panel.H;
    const b = panel.buttons.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    return b ? b.id : null;
  }
  function clickButton(id) {
    if (id === 'next') goTo(cur + 1);
    else if (id === 'back') goTo(cur - 1);
    else if (id === 'auto') { auto = !auto; if (auto && cur === CH.length - 1) goTo(0); chapterStart = auto ? now : chapterStart; drawPanel(); }
    else if (id === 'recenter') recenter();
  }
  function pointerDown(p) {
    updateRay(p);
    const h = hitTest(p);
    p.down = true; p.downAt = now; p.moved = 0; p.downHit = h;
    p.drag = h && h.type === 'globe' ? { grab: h.local.clone() } : null;
  }
  function pointerUp(p) {
    if (!p.down) return;
    p.down = false;
    const h0 = p.downHit;
    if (h0 && h0.type === 'panel') { const id = buttonAt(h0); if (id && id === buttonAt(p.hit)) clickButton(id); }
    else if (h0 && h0.type === 'globe' && p.moved < 2.5 && now - p.downAt < 0.8) selectAirport(nearestAirport(h0.local, 1.5 / Math.sqrt(zoom)));
    p.drag = null; p.downHit = null;
  }
  function dragGlobe(p) {
    const ray = p.rc.ray, C = globe.getWorldPosition(new V3());
    const gh = sphereHit(ray);
    const target = gh ? gh.point.clone().sub(C).normalize()
      : ray.origin.clone().addScaledVector(ray.direction, C.clone().sub(ray.origin).dot(ray.direction)).sub(C).normalize();
    const curDir = p.drag.grab.clone().applyQuaternion(globeWorldQuat()).normalize();
    const dq = new Q().setFromUnitVectors(curDir, target);
    p.moved += 2 * Math.acos(clamp(dq.w, -1, 1)) / DEG;
    if (p.moved > 2.5) { userControl = true; focusTw = null; }
    applyWorldRotation(dq);
  }
  // mouse & touch (desktop / phone preview)
  canvas.addEventListener('pointermove', (e) => {
    mouse.ndc.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  });
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    mouse.ndc.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    pointerDown(mouse);
  });
  canvas.addEventListener('pointerup', () => pointerUp(mouse));
  canvas.addEventListener('pointerleave', () => { if (!mouse.down) mouse.ndc.set(9, 9); });
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * 0.0012)); }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goTo(cur + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(cur - 1);
    else if (e.key === ' ') { e.preventDefault(); clickButton('auto'); }
    else if (e.key === 'r' || e.key === 'R') recenter();
  });

  // XR controllers: ray pointer + grip grab + thumbstick + A/B/X/Y
  const rayMat = new THREE.LineBasicMaterial({ color: 0x9fd0ff, transparent: true, opacity: 0.85, depthTest: false });
  const rayGeo = new THREE.BufferGeometry().setFromPoints([new V3(0, 0, 0), new V3(0, 0, -1)]);
  for (let k = 0; k < 2; k++) {
    const ctrl = renderer.xr.getController(k);
    const p = makePointer('xr', ctrl);
    const line = new THREE.Line(rayGeo, rayMat); line.renderOrder = 40; line.visible = false; ctrl.add(line);
    const cursor = new THREE.Mesh(new THREE.SphereGeometry(0.006, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
    cursor.renderOrder = 41; cursor.visible = false; scene.add(cursor);
    Object.assign(p, { line, cursor });
    ctrl.addEventListener('connected', (e) => { p.source = e.data; line.visible = true; });
    ctrl.addEventListener('disconnected', () => { p.source = null; line.visible = false; cursor.visible = false; p.down = false; p.squeeze = null; });
    ctrl.addEventListener('selectstart', () => pointerDown(p));
    ctrl.addEventListener('selectend', () => pointerUp(p));
    ctrl.addEventListener('squeezestart', () => {
      ctrl.updateMatrixWorld();
      p.squeeze = { qc0: ctrl.getWorldQuaternion(new Q()), qg0: globeWorldQuat() };
      userControl = true; focusTw = null;
      const o = pointers.find((q) => q !== p && q.kind === 'xr' && q.squeeze);
      if (o) twoHand = { d0: ctrl.getWorldPosition(new V3()).distanceTo(o.ctrl.getWorldPosition(new V3())), z0: zoom };
    });
    ctrl.addEventListener('squeezeend', () => { p.squeeze = null; twoHand = null; });
    scene.add(ctrl);
    const grip = renderer.xr.getControllerGrip(k);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, 0.09, 12), new THREE.MeshBasicMaterial({ color: 0x1d2a44 }));
    body.rotation.x = Math.PI / 2; body.position.z = 0.03;
    grip.add(body); scene.add(grip);
    ctrl.addEventListener('connected', (e) => { body.visible = !e.data.hand; });
  }
  let twoHand = null;

  function updatePointers(dt) {
    let hovered = -1, btn = null;
    for (const p of pointers) {
      if (p.kind === 'xr' && !p.source) continue;
      if (p.kind === 'mouse' && renderer.xr.isPresenting) continue;
      updateRay(p);
      const h = p.hit = hitTest(p);
      if (p.down && p.drag) dragGlobe(p);
      if (p.squeeze) {
        const qc = p.ctrl.getWorldQuaternion(new Q());
        const dq = qc.clone().multiply(p.squeeze.qc0.clone().invert());
        setGlobeWorldQuat(dq.multiply(p.squeeze.qg0));
        if (twoHand) {
          const o = pointers.find((q) => q !== p && q.kind === 'xr' && q.squeeze);
          if (o) setZoom(twoHand.z0 * p.ctrl.getWorldPosition(new V3()).distanceTo(o.ctrl.getWorldPosition(new V3())) / twoHand.d0);
        }
      }
      if (h && h.type === 'panel') btn = btn || buttonAt(h);
      if (h && h.type === 'globe' && !(p.down && p.moved > 2.5) && hovered < 0) hovered = nearestAirport(h.local, 1.5 / Math.sqrt(zoom));
      if (p.kind === 'xr') {
        p.line.scale.z = h ? h.distance : 1.5;
        p.cursor.visible = !!h; if (h) p.cursor.position.copy(h.point);
        const gp = p.source.gamepad;
        if (gp && !p.source.hand) {
          const ax = gp.axes.length >= 4 ? gp.axes[2] : 0, ay = gp.axes.length >= 4 ? gp.axes[3] : 0;
          if (Math.abs(ax) > 0.15) { applyWorldRotation(new Q().setFromAxisAngle(new V3(0, 1, 0), ax * 1.8 * dt)); userControl = true; focusTw = null; }
          if (Math.abs(ay) > 0.15) setZoom(zoom * Math.exp(-ay * 1.2 * dt));
          const pressed = (b) => !!(gp.buttons[b] && gp.buttons[b].pressed);
          const edge = (b) => pressed(b) && !p.prev[b];
          if (edge(4)) goTo(cur + 1);
          if (edge(5)) goTo(cur - 1);
          if (edge(3)) recenter();
          p.prev = gp.buttons.map((b) => b.pressed);
        }
      }
    }
    setHover(hovered);
    if (btn !== hoverBtn) { hoverBtn = btn; drawPanel(); }
    if (!renderer.xr.isPresenting) canvas.style.cursor = btn || hovered >= 0 ? 'pointer' : mouse.down ? 'grabbing' : 'grab';
  }

  // ------------------------------------------------------------------ XR SESSION
  let inXR = false, isAR = false, recenterIn = 0;
  function recenter() {
    if (!renderer.xr.isPresenting) {
      globe.quaternion.identity(); setZoom(1); userControl = false; focusTw = null;
      return;
    }
    scene.updateMatrixWorld();
    const Eye = camera.getWorldPosition(new V3()), q = camera.getWorldQuaternion(new Q());
    const f = new V3(0, 0, -1).applyQuaternion(q); f.y = 0;
    if (f.lengthSq() < 1e-6) f.set(0, 0, -1);
    f.normalize();
    world.position.copy(Eye).addScaledVector(f, 1.15); world.position.y = Eye.y - 0.12;
    world.rotation.set(0, Math.atan2(-f.x, -f.z), 0);
  }
  async function startXR(mode) {
    try {
      const session = await navigator.xr.requestSession(mode, { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);
      inXR = true; isAR = mode === 'immersive-ar';
      stars.visible = !isAR; renderer.setClearColor(0x02040a, isAR ? 0 : 1);
      recenterIn = 3; drawPanel();
      session.addEventListener('end', () => {
        inXR = false; isAR = false; stars.visible = true; renderer.setClearColor(0x02040a, 1);
        world.position.set(0, 0, 0); world.rotation.set(0, 0, 0); placeDesktopCamera(); drawPanel();
      });
    } catch (err) {
      say('Could not start ' + (mode === 'immersive-ar' ? 'AR' : 'VR') + ': ' + err.message);
    }
  }
  if (navigator.xr && window.isSecureContext) {
    navigator.xr.isSessionSupported('immersive-vr').then((ok) => { if (ok) $('btnVR').hidden = false; }).catch(() => {});
    navigator.xr.isSessionSupported('immersive-ar').then((ok) => { if (ok) $('btnAR').hidden = false; }).catch(() => {});
  } else if (!window.isSecureContext) {
    $('hint').innerHTML += '<br><b>WebXR needs HTTPS (or localhost) to enter VR.</b>';
  }
  if (!navigator.xr) $('hint').innerHTML += '<br>Open this page in the Meta Quest Browser for VR.';
  $('btnVR').addEventListener('click', () => startXR('immersive-vr'));
  $('btnAR').addEventListener('click', () => startXR('immersive-ar'));

  // ---------------------------------------------------------------- MAIN LOOP
  const sunCam = new V3(-0.55, 0.42, 1.0).normalize();
  let last = performance.now() / 1000;
  renderer.setAnimationLoop(() => {
    const t = performance.now() / 1000, dt = Math.min(0.1, t - last);
    last = t; now = t;
    if (recenterIn > 0 && renderer.xr.isPresenting && --recenterIn === 0) recenter();
    updateTweens();
    updateOrientation(dt);
    updatePointers(dt);
    scene.updateMatrixWorld();
    U.uSun.value.copy(sunCam).applyQuaternion(camera.getWorldQuaternion(new Q()));
    atmoU.uCenter.value.copy(globe.getWorldPosition(new V3())); atmoU.uRad.value = GLOBE_R * zoom;
    updateLabels(dt);
    if (auto && cur < CH.length - 1 && now - chapterStart > CH[cur].dur) goTo(cur + 1);
    renderer.render(scene, camera);
  });

  const m = /ch=(\d+)/.exec(location.hash);
  goTo(m ? +m[1] : 0);
  $('loading').remove();
  window.__NT = { goTo, selectAirport, idx, get cur() { return cur; }, ready: true };
})();
</script>
</body>
</html>
