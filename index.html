<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="experiment-description" content="Overview directory of all experiments with links and auto loaded file descriptions.">
    <title>Directory Index</title>
    <style>
        :root {
            color-scheme: light;
            --background: #fff;
            --foreground: #111;
            --link: #00e;
            --visited-link: #551a8b;
            --description: #444;
            --button-background: #f2f2f2;
            --button-border: #777;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --background: #181818;
                --foreground: #eee;
                --link: #8ab4f8;
                --visited-link: #c8a2e8;
                --description: #bbb;
                --button-background: #303030;
                --button-border: #888;
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --background: #181818;
            --foreground: #eee;
            --link: #8ab4f8;
            --visited-link: #c8a2e8;
            --description: #bbb;
            --button-background: #303030;
            --button-border: #888;
        }

        body {
            font-family: sans-serif;
            padding: 2rem;
            line-height: 1.5;
            background: var(--background);
            color: var(--foreground);
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        
        /* Classic link styling */
        a {
            color: var(--link);
            text-decoration: underline;
        }
        
        a:visited {
            color: var(--visited-link);
        }

        #theme-toggle {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--button-border);
            border-radius: 0.25rem;
            background: var(--button-background);
            color: var(--foreground);
            font: inherit;
            cursor: pointer;
        }

        ul {
            margin-top: 1rem;
            padding-left: 20px;
        }

        li {
            margin-bottom: 0.5rem;
        }

        .description {
            margin-left: 0.4rem;
            color: var(--description);
        }
    </style>
    <script>
        try {
            const savedTheme = localStorage.getItem('index-theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (_) {
            // Theme selection still works for this page when storage is unavailable.
        }
    </script>
</head>
<body>
    <header class="page-header">
        <h1>list of experiments:</h1>
        <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>
    
    <ul>
        <!-- Loop 1: Jekyll Pages -->
        {% for page in site.html_pages %}
            {% if page.url != "/" %}
            <li>
                <a href="{{ site.baseurl }}{{ page.url }}">{{ page.name }}</a>
            </li>
            {% endif %}
        {% endfor %}

        <!-- Loop 2: Static Files -->
        {% for file in site.static_files %}
            {% if file.extname == '.html' %}
            <li>
                <a href="{{ site.baseurl }}{{ file.path }}">{{ file.name }}</a>
            </li>
            {% endif %}
        {% endfor %}
    </ul>

    <script>
        (function() {
            const links = document.querySelectorAll('ul li a[href]');
            links.forEach((link) => {
                const href = link.getAttribute('href');
                if (!href) return;

                fetch(href)
                    .then((response) => {
                        if (!response.ok) {
                            throw new Error('Failed to load description');
                        }
                        return response.text();
                    })
                    .then((html) => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const meta = doc.querySelector('meta[name="experiment-description"]');
                        const description = meta && meta.getAttribute('content');

                        if (!description) return;

                        const span = document.createElement('span');
                        span.className = 'description';
                        span.textContent = `— ${description}`;
                        link.insertAdjacentElement('afterend', span);
                    })
                    .catch(() => {
                        // Leave link without description when metadata is unavailable.
                    });
            });
        })();

        const themeToggle = document.getElementById('theme-toggle');
        const root = document.documentElement;

        function updateThemeToggle() {
            const isDark = root.dataset.theme
                ? root.dataset.theme === 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
            themeToggle.textContent = isDark ? 'Light mode' : 'Dark mode';
            themeToggle.setAttribute('aria-pressed', String(isDark));
        }

        themeToggle.addEventListener('click', () => {
            const isDark = root.dataset.theme
                ? root.dataset.theme === 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
            const nextTheme = isDark ? 'light' : 'dark';
            root.dataset.theme = nextTheme;
            try {
                localStorage.setItem('index-theme', nextTheme);
            } catch (_) {
                // The selected theme remains active until the page is reloaded.
            }
            updateThemeToggle();
        });

        updateThemeToggle();
    </script>

</body>
</html>
